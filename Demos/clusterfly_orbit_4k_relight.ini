; ClusterFly_M 360 deg orbit @ 4K - lighting_mode relight + sh_color_space srgb_rec709_display
; Scene: clusterfly_orbit.pov (RelightSplats=1 default)
; Frames -> results/clusterfly_orbit_4k_relight/
; Video  -> results/clusterfly_orbit_4k_relight.mp4 (+ 1080p)
;
;   ../unix/povray clusterfly_orbit_4k_relight.ini

Input_File_Name=clusterfly_orbit.pov
Output_File_Name=results/clusterfly_orbit_4k_relight/frame.png
Output_File_Type=N

Width=3840
Height=2160
Display=off
Verbose=on
Antialias=off

Initial_Frame=1
Final_Frame=160
Initial_Clock=0
Final_Clock=1

Cyclic_Animation=off
