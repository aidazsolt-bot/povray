; samples2 + IOR floor orbit — one 360 deg revolution.
; 160 frames @ 20 fps -> 8 s; 4K.
;
;   systemd-inhibit --what=idle:sleep --who=povray --why='rose 4K orbit' \
;     ../unix/povray rose_floor_samples2_ior_orbit.ini
;   ffmpeg -y -framerate 20 -i results/rose_floor_samples2_ior_orbit/frame%03d.png \
;     -c:v libx264 -crf 18 -pix_fmt yuv420p results/rose_floor_samples2_ior_orbit.mp4

Input_File_Name=rose_floor_samples2_ior_orbit.pov
Output_File_Name=results/rose_floor_samples2_ior_orbit/frame.png
Output_File_Type=N

Width=3840
Height=2160
Display=off
Verbose=on
Antialias=off

Initial_Frame=1
Final_Frame=160
Initial_Clock=0
Final_Clock=1

Cyclic_Animation=off
