; Apple 360° orbit — renders PNG sequence for optional ffmpeg encode.
; From Demos/:
;   ../unix/povray apple_orbit.ini
; Video from PNGs (ffmpeg-free has no libx264; openh264 often fails — use mpeg4 or vp9):
;   ffmpeg -y -framerate 12 -i results/apple_orbit/frame%02d.png \
;     -c:v mpeg4 -q:v 5 -pix_fmt yuv420p results/apple_orbit.mp4
;   ffmpeg -y -framerate 12 -i results/apple_orbit/frame%02d.png \
;     -c:v libvpx-vp9 -b:v 1M -pix_fmt yuv420p results/apple_orbit.webm

Input_File_Name=apple_orbit.pov
Output_File_Name=results/apple_orbit/frame.png
Output_File_Type=N

Width=512
Height=512
Display=off
Verbose=on
Antialias=off

Initial_Frame=1
Final_Frame=36
Initial_Clock=0
Final_Clock=1

; Cyclic: frame 36 at clock≈1 matches frame 1 at clock=0 for a seamless loop
; if you omit the last duplicate when encoding (use -frames 35 or Final_Frame=35).
Cyclic_Animation=on
