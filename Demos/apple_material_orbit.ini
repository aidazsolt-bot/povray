; Apple material orbit — 3 revolutions, HD, floor on y=0.
; 180 frames @ 10 fps → 18 s (same pacing as rose_ior_orbit).
;
;   ../unix/povray apple_material_orbit.ini
;   ffmpeg -y -framerate 10 -i results/apple_material_orbit/frame%03d.png \
;     -c:v mpeg4 -q:v 4 -pix_fmt yuv420p results/apple_material_orbit.mp4

Input_File_Name=apple_material_orbit.pov
Output_File_Name=results/apple_material_orbit/frame.png
Output_File_Type=N

Width=1920
Height=1080
Display=off
Verbose=on
Antialias=off

Initial_Frame=1
Final_Frame=180
Initial_Clock=0
Final_Clock=3

Cyclic_Animation=off
