; Rose IOR orbit — 3 revolutions at half the speed of rose_orbit.ini.
; Previous rose_orbit: 180 frames @ 20 fps → 9 s (3 s/rev).
; This:         180 frames @ 10 fps → 18 s (6 s/rev) = half angular speed.
;
;   ../unix/povray rose_ior_orbit.ini
;   ffmpeg -y -framerate 10 -i results/rose_ior_orbit/frame%03d.png \
;     -c:v mpeg4 -q:v 4 -pix_fmt yuv420p results/rose_ior_orbit.mp4

Input_File_Name=rose_ior_orbit.pov
Output_File_Name=results/rose_ior_orbit/frame.png
Output_File_Type=N

Width=1920
Height=1080
Display=off
Verbose=on
Antialias=off

Initial_Frame=1
Final_Frame=180
Initial_Clock=0
Final_Clock=3

Cyclic_Animation=off
