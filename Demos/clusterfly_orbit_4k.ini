; ClusterFly_M 360 deg orbit @ 4K (current binary)
; Frames -> results/clusterfly_orbit_4k/frame%03d.png
; Video  -> results/clusterfly_orbit_4k.mp4
;
;   ../unix/povray clusterfly_orbit_4k.ini

Input_File_Name=clusterfly_orbit.pov
Output_File_Name=results/clusterfly_orbit_4k/frame.png
Output_File_Type=N

Width=3840
Height=2160
Display=off
Verbose=on
Antialias=off

Initial_Frame=1
Final_Frame=160
Initial_Clock=0
Final_Clock=1

Cyclic_Animation=off
