; Rose HD orbit — 3 full revolutions (clock 0..3).
; From Demos/:
;   ../unix/povray rose_orbit.ini
; Encode (ffmpeg-free: mpeg4 or vp9; openh264 often fails):
;   ffmpeg -y -framerate 20 -i results/rose_orbit/frame%03d.png \
;     -c:v mpeg4 -q:v 4 -pix_fmt yuv420p results/rose_orbit.mp4
;   ffmpeg -y -framerate 20 -i results/rose_orbit/frame%03d.png \
;     -c:v libvpx-vp9 -b:v 4M -pix_fmt yuv420p results/rose_orbit.webm

Input_File_Name=rose_orbit.pov
Output_File_Name=results/rose_orbit/frame.png
Output_File_Type=N

Width=1920
Height=1080
Display=off
Verbose=on
Antialias=off

; 60 frames/rev × 3 revs = 180 → 9 s @ 20 fps
Initial_Frame=1
Final_Frame=180
Initial_Clock=0
Final_Clock=3

Cyclic_Animation=off
