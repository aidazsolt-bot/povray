; Rerender of samples2 + IOR floor orbit (current binary / scene).
; Old frames stay in results/rose_floor_samples2_ior_orbit/
; New frames -> results/rose_floor_samples2_ior_orbit_khr/
; Video  -> results/rose_floor_samples2_ior_orbit_4k_khr.mp4
;
;   ../unix/povray rose_floor_samples2_ior_orbit_khr.ini
;   ffmpeg -y -framerate 20 -i results/rose_floor_samples2_ior_orbit_khr/frame%03d.png \
;     -c:v mpeg4 -q:v 4 -pix_fmt yuv420p results/rose_floor_samples2_ior_orbit_4k_khr.mp4

Input_File_Name=rose_floor_samples2_ior_orbit.pov
Output_File_Name=results/rose_floor_samples2_ior_orbit_khr/frame.png
Output_File_Type=N

Width=3840
Height=2160
Display=off
Verbose=on
Antialias=off

Initial_Frame=1
Final_Frame=160
Initial_Clock=0
Final_Clock=1

Cyclic_Animation=off
