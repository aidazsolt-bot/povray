name: 'Windows Build Compatibility Tests'

on:
  workflow_dispatch

jobs:
  build_windows:
    name: Visual Studio ${{ matrix.visual-studio }} ${{ matrix.configuration }} ${{ matrix.platform }}

    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        visual-studio: [2022]
        variant: [64, sse2, 32]
        include:
        - visual-studio: 2022
          os: windows-latest
          toolset: v143
          solution: vs2022
        - variant: 64
          configuration: Release
          platform: x64
        - variant: sse2
          configuration: Release-SSE2
          platform: Win32
        - variant: 32
          configuration: Release
          platform: Win32

    steps:

    - name: 'Matrix Diagnostics'
      shell: bash
      run: |
        echo '${{ toJSON(matrix) }}'

    - name: 'Check out Repository'
      uses: actions/checkout@v7

    - name: 'Add MSBuild to PATH'
      uses: microsoft/setup-msbuild@v3

    - name: 'Build'
      uses: ./.github/actions/windows_build
      with:
        pov-ray-build-id: ghvs${{matrix.visual-studio}}${{github.run_number}}
        solution: ${{matrix.solution}}
        configuration: ${{matrix.configuration}}
        platform: ${{matrix.platform}}
        toolset: ${{matrix.toolset}}
        msbuild-options: ''
    - name: 'Sanity-Check Working Tree'
      uses: ./.github/actions/git_check_repo
    - name: 'Upload Artifacts for Manual Testing'
      uses: actions/upload-artifact@v7
      with:
        name: artifact_bin_${{matrix.visual-studio}}_${{matrix.variant}}
        path: windows/${{matrix.solution}}/bin*/*.exe
